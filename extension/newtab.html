<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cust*m Tab</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <!-- Redirect mode: full-screen frame holding the user's target URL -->
    <div id="redirect-frame-wrap" class="redirect-frame-wrap" hidden>
      <iframe
        id="redirect-frame"
        class="redirect-frame"
        title="Custom tab target"
      ></iframe>
    </div>

    <!-- Ambient gradient background -->
    <div class="ct-ambient" aria-hidden="true">
      <div class="e e-purple"></div>
      <div class="e e-red"></div>
      <div class="e e-yellow"></div>
      <div class="ct-blur"></div>
    </div>

    <button
      class="logo-placeholder"
      id="logo"
      type="button"
      title="cust*m Tab settings"
      aria-label="Open cust*m Tab settings"
    >
      <img src="custmTab-logo.svg" alt="" />
    </button>

    <a class="settings-link" id="settings-link" href="#" title="Settings">
      &#9881; Settings
    </a>

    <!-- DASHBOARD -->
    <main class="dashboard-container" id="dashboard">
      <!-- Every row here is optional. newtab.js marks the ones the user
           turned off [hidden], and the whole block when none remain. -->
      <div class="clock-block" id="clock-block">
        <div class="greeting" id="greeting"></div>
        <div class="clock" id="clock" aria-live="off"></div>
        <div class="date-line" id="date-line"></div>
      </div>

      <form class="search-form" id="search-form" autocomplete="off" role="search">
        <div class="search-shell">
          <div class="engine-picker" id="engine-picker">
            <button
              type="button"
              class="engine-current"
              id="engine-current"
              title="Choose search engine"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="engine-menu"
            >
              <span class="engine-icon" id="engine-icon"></span>
              <span class="engine-caret" aria-hidden="true">▾</span>
            </button>
            <div class="engine-menu" id="engine-menu" role="listbox" hidden></div>
          </div>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search or enter a URL…"
            aria-label="Search or enter a URL"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </form>

      <div class="shortcut-grid" id="shortcuts-grid"></div>
    </main>

    <!-- Add / edit bookmark -->
    <div
      class="modal-overlay"
      id="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-card">
        <h2 id="modal-title">Add bookmark</h2>
        <input
          type="text"
          id="bookmark-name"
          class="ct-input"
          placeholder="Name (e.g. YouTube)"
          aria-label="Bookmark name"
        />
        <input
          type="text"
          id="bookmark-url"
          class="ct-input"
          placeholder="URL (e.g. youtube.com)"
          aria-label="Bookmark URL"
          spellcheck="false"
        />
        <p id="modal-error" class="modal-error" role="alert" hidden></p>
        <div class="modal-btns">
          <button type="button" class="ct-btn-ghost" id="modal-cancel">Cancel</button>
          <button type="button" class="ct-btn-primary" id="modal-save">Save</button>
        </div>
      </div>
    </div>

    <!-- Load order matters: compat.js defines CUSTM_API, which store.js needs. -->
    <script src="compat.js"></script>
    <script src="url.js"></script>
    <script src="dom.js"></script>
    <script src="icons.js"></script>
    <script src="favicon.js"></script>
    <script src="appearance.js"></script>
    <script src="backgrounds.js"></script>
    <script src="pexels.js"></script>
    <script src="search-engines.js"></script>
    <script src="store.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
