name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — a force-push shouldn't keep
# burning minutes on a diff nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Validate manifest and asset references
        run: npm run validate:manifest

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  package:
    name: Package (Chrome + Firefox)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build store packages
        run: npm run build

      # Independent check that the hand-rolled ZIP writer emits a valid archive.
      - name: Verify archive integrity
        run: |
          for zip in dist/*.zip; do
            echo "── $zip"
            unzip -t "$zip"
          done

      - name: Lint Firefox package with web-ext
        run: npm run lint:ext

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: dist/*.zip
          retention-days: 14

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        # The action errors out unless the repository's Dependency graph is
        # enabled under Settings → Code security. Until that is switched on,
        # a hard failure here would block every PR for a reason unrelated to
        # the change under review.
        #
        # TODO: enable Dependency graph, then delete this line so a vulnerable
        # transitive dependency blocks the merge as intended.
        continue-on-error: true
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
